# This service is @mahjong/client. The dashboard start command still wins
# on new Railway projects; keep Railpack + a prebuilt listener.
[build]
builder = "RAILPACK"
buildCommand = "echo 'using committed dist and server.bundle.mjs'"
watchPatterns = ["**"]

[deploy]
startCommand = "node start.mjs || node ../start.mjs || node server.bundle.mjs"
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
