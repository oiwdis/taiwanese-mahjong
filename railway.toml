[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# The whole repo is one service. An empty/narrow watch path (common when
# Railway guesses a monorepo) skips deploys and leaves a 502 in place.
watchPatterns = ["**"]

[deploy]
startCommand = "node start.mjs || node server/start.mjs || node client/server.bundle.mjs"
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
